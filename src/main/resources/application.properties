spring.application.name=BajriX

# ===== MySQL Database Configuration =====
# Uses environment variables with safe development defaults
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bajriX_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== Email Configuration (SMTP) =====
# Passwords and sensitive credentials must be supplied via environment variables
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:demo@example.com}
spring.mail.password=${MAIL_PASSWORD:placeholder_app_password}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===== Server Port =====
server.port=8080